name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · lint y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: ./backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: ./backend
        run: ruff check .

      - name: Tests (pytest)
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET_KEY: clave-de-integracion-continua-suficientemente-larga
          ENVIRONMENT: test
        run: pytest -q

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: ./frontend
        run: npm run lint

      - name: Compilar
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Docker · construir imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables de entorno de prueba
        working-directory: ./docker
        run: |
          {
            echo "JWT_SECRET_KEY=clave-solo-para-construir-imagenes-en-ci"
            echo "MYSQL_ROOT_PASSWORD=root_ci"
            echo "MYSQL_PASSWORD=golf_ci"
          } > .env

      - name: Construir
        working-directory: ./docker
        run: docker compose build
