events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Redirige todo HTTP a HTTPS, salvo el reto de Let's Encrypt.
    server {
        listen 80;
        server_name golftrackertfg.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name golftrackertfg.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/golftrackertfg.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/golftrackertfg.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Cabeceras de seguridad básicas
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 2m;

        # API: la barra final de proxy_pass quita el prefijo /api/
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web: el contenedor del frontend ya resuelve el fallback de la SPA.
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
