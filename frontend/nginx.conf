server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: sin esto, recargar en /rondas/12 devuelve 404 porque
    # esa ruta sólo existe dentro de React Router, no en el disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index nunca se cachea: es quien apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
